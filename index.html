<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B Integration Middleware Registry</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <main class="max-w-4xl mx-auto py-12 px-4">
        <header class="mb-12 border-b border-slate-200 pb-6">
            <h1 class="text-3xl font-bold text-slate-900 tracking-tight">
                B2B Integration Middleware Registry
            </h1>
            <p class="text-slate-600 mt-2">
                Automated live monitoring of custom webhook connectors and automation bridges.
            </p>
        </header>

        <div id="directory-list" class="space-y-4">
            <p class="text-slate-500 italic">Loading live automation streams...</p>
        </div>
    </main>

    <script>
        // Dynamically fetch the json file updated by your n8n workflow
        fetch('./data/integrations.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('directory-list');
                container.innerHTML = ''; // Clear loading text

                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="text-slate-500 italic">Awaiting first automated data sync stream...</p>';
                    return;
                }

                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "p-6 border border-slate-200 rounded-xl bg-white shadow-sm hover:border-blue-500 transition-colors";
                    card.innerHTML = `
                        <div class="flex items-center gap-2 text-sm font-semibold text-blue-600 mb-2">
                            <span>${item.tool_a}</span>
                            <span class="text-slate-400">➔</span>
                            <span>${item.tool_b}</span>
                        </div>
                        <h2 class="text-xl font-bold text-slate-800 capitalize mb-2">
                            ${item.tool_a} to ${item.tool_b} Data Bridge
                        </h2>
                        <p class="text-slate-600 text-sm mb-4">${item.use_case}</p>
                        
                        <div class="flex items-center justify-between border-t border-slate-100 pt-4 mt-4 bg-slate-50 -mx-6 -mb-6 p-4 rounded-b-xl">
                            <span class="text-xs text-green-600 font-medium bg-green-50 px-2 py-1 rounded">
                                ● Connected Live Stream
                            </span>
                            <button class="text-xs font-semibold text-white bg-blue-600 px-3 py-1.5 rounded-md hover:bg-blue-700 cursor-pointer">
                                Unlock Live Sync Template ($49/mo)
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById('directory-list').innerHTML = '<p class="text-red-500">Error rendering automated data layer.</p>';
            });
    </script>
</body>
</html>
